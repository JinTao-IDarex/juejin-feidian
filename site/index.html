<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沸点抽卡 · 翻一张牌，看掘金今天在聊什么</title>
<meta name="description" content="把掘金沸点做成牌面，一张一张翻，每张配一句 AI 点评。不登录、不上传、不代发。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="page-wrap">
  <div class="page" id="page">

    <!-- Hero：1440x230 @ (0,0) -->
    <header class="hero">
      <span class="chip-tips">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
          <path d="M9.2 4.6c0 2.7-3.7 5.1-3.7 5.1S1.8 7.3 1.8 4.6a3.7 3.7 0 117.4 0z" fill="#1E80FF"/>
          <circle cx="5.5" cy="4.4" r="1.3" fill="#D6E8FF"/>
        </svg>
        Tips
      </span>
      <h1>翻一张牌，看掘金今天在聊什么</h1>
      <p>牌面是当日公开沸点，右侧配一句 AI 点评。觉得对就复制去评论区，觉得偏就自己改。</p>
    </header>

    <!-- 抽卡舞台：1440x620 @ (0,226) -->
    <section class="stage">
      <div class="stage-inner" id="stageInner">
        <!-- 卡片按 z 序插入：邻卡 → 主卡 → 箭头 → AI 卡 -->
        <div class="cards" id="cards" style="position:absolute;inset:0;z-index:0"></div>

        <button class="round prev" id="btnPrev" aria-label="上一张">
          <svg width="12" height="14" viewBox="0 0 12 14" fill="none" aria-hidden="true">
            <path d="M8.8 2.6L4.4 7l4.4 4.4" stroke="#1A1D21" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="round next" id="btnNext" aria-label="下一张">
          <svg width="12" height="14" viewBox="0 0 12 14" fill="none" aria-hidden="true">
            <path d="M3.2 2.6L7.6 7 3.2 11.4" stroke="#1A1D21" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <aside class="ai" id="ai"></aside>
      </div>
    </section>

    <!-- 进度条：1440x86 @ (0,862) -->
    <footer class="hud">
      <div class="status">
        <span class="ring"></span>
        <span id="progText">第 1 / 60 张 · 已看 0 · 喜欢 0</span>
      </div>
      <div class="keys">←→ 翻牌　　空格 抽下一张　　L 喜欢　　C 看评论</div>
    </footer>

  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
